services:
  mongodb:
    image: mongo:7
    container_name: orgmgmt-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: organisationsmanagement

  backend:
    build: ./backend
    container_name: orgmgmt-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/organisationsmanagement

  frontend:
    build: ./frontend
    container_name: orgmgmt-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
